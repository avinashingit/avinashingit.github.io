<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#f4f0e8">
    <meta name="color-scheme" content="light dark">
    <meta name="build" content="{{ site.time | date: '%s' }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/images/github-profile.jpg' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/og-v2.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <meta name="twitter:image" content="{{ '/assets/images/og-v2.png' | absolute_url }}">
    {% if page.math %}
      <script>
        window.MathJax = {
          tex: {
            inlineMath: { "[+]": [["$", "$"]] }
          }
        };
      </script>
      <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
    {% endif %}
    {% if page.mermaid %}
      <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
        mermaid.initialize({
          startOnLoad: true,
          securityLevel: "strict",
          theme: document.documentElement.dataset.theme === "dark" ? "dark" : "neutral"
        });
      </script>
    {% endif %}
    <script>
      (() => {
        const saved = localStorage.getItem("portfolio-theme");
        document.documentElement.dataset.theme = saved || "light";
      })();
    </script>
  </head>
  <body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    <a class="skip-link" href="#content">Skip to content</a>
    {% include header.html %}
    <main id="content">{{ content }}</main>
    {% include footer.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  </body>
</html>
