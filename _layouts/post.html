---
layout: default
---
<article class="post shell">
  <header class="post-header">
    <a class="eyebrow back-link" href="{{ '/writing/' | relative_url }}">← All writing</a>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-dek">{{ page.description }}</p>{% endif %}
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.tags %}
        <span aria-hidden="true">·</span>
        <span>{{ page.tags | join: " / " }}</span>
      {% endif %}
    </div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <footer class="post-footer">
    <p>Have a thought or want to compare notes?</p>
    <a class="text-link" href="mailto:{{ site.author.email }}">Send me an email ↗</a>
  </footer>
</article>
