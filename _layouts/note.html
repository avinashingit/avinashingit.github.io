---
layout: default
---
<article class="note shell">
  <header class="note-header">
    <div class="note-meta-line">
      <a class="back-link" href="{{ '/notes/' | relative_url }}">← All notes</a>
      <span aria-hidden="true">·</span>
      <p class="note-breadcrumb">{{ page.note_collection | default: "ML system design" }} · {{ page.note_section }}</p>
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="note-dek">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose note-prose">
    {{ content }}
  </div>
</article>
